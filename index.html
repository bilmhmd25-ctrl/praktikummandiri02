<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan Barang</title>
</head>
<body>

  <!-- Menu Navigasi Utas -->
  <p>
    <a href="#">Home</a> |
    <a href="#">Generate Link</a> | 
    <a href="#">Transaction History</a> | 
    <a href="#">Policy</a>  |
    <a href="#">Logout</a> |
    
  </p>

  <hr>

  <!-- Form Utama -->
  <form action="#" method="post" enctype="multipart/form-data">
    <table>
      <tr>
        <!-- Sisi Kiri: Preview Gambar & Upload -->
        <td valign="top" align="center" width="200">
          <table border="1" width="150" height="150">
            <tr>
              <td align="center" valign="middle">
                [ Gambar Produk ]
              </td>
            </tr>
          </table>
          <br>
          <input type="file" id="upload" name="upload">
        </td>

        <!-- Sisi Kanan: Form Isian -->
        <td valign="top">
          <table>
            <tr>
              <td><label for="title">Title Here :</label></td>
              <td><input type="text" id="title" name="title" value="MacBook Air E800"></td>
            </tr>

            <tr>
              <td valign="top"><label for="description">Description :</label></td>
              <td>
                <textarea id="description" name="description" rows="5" cols="30">Year : 2009&#10;&#10;Model :&#10;&#10;Condition : Mint</textarea>
              </td>
            </tr>

            <tr>
              <td><label for="account_number">Account Number :</label></td>
              <td><input type="text" id="account_number" name="account_number" value="123-456-789-0"></td>
            </tr>

            <tr>
              <td><label for="bank">Bank :</label></td>
              <td>
                <select id="bank" name="bank">
                  <option value="BTN" selected>BTN</option>
                  <option value="BCA">BCA</option>
                  <option value="Mandiri">Mandiri</option>
                  <option value="BNI">BNI</option>
                </select>
              </td>
            </tr>

            <tr>
              <td><label for="account_holder">Account Holder :</label></td>
              <td><input type="text" id="account_holder" name="account_holder" value="Name Here"></td>
            </tr>

            <tr>
              <td><label for="transaction">Transaction :</label></td>
              <td>
                <input type="number" id="transaction" name="transaction" value="1" min="1"><br>
                <small>* if the transaction is for 3 person, choose 3 from the drop-down list</small>
              </td>
            </tr>

            <tr>
              <td></td>
              <td>
                <input type="checkbox" id="send_mobile" name="send_option[]" value="mobile" checked>
                <label for="send_mobile">Send to Mobile Phone</label><br>
                <input type="checkbox" id="send_email" name="send_option[]" value="email" checked>
                <label for="send_email">Send to Email</label>
              </td>
            </tr>

            <tr>
              <td><label for="mobile_phone">Send to Mobile Phone :</label></td>
              <td><input type="text" id="mobile_phone" name="mobile_phone" value="1234567890, 1234567891" size="30"></td>
            </tr>

            <tr>
              <td><label for="email">Send to Email :</label></td>
              <td><input type="email" id="email" name="email" value="mfmm2g13@soton.ac.uk, fys_06@yahoo.com" size="30"></td>
            </tr>

            <tr>
              <td></td>
              <td>
                <br>
                <input type="submit" value="Generate Nabr Link">
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </form>

</body>
</html>
